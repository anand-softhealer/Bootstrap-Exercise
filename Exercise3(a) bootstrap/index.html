<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="static/src/css/style.css">
    <title>Billing Form</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-sm-8">
                <h4>Bill Address</h4>
                <form>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label>First name</label>
                            <input type="text" class="form-control" placeholder="First name">
                        </div>
                        <div class="form-group col-md-6">
                            <label>Last name</label>
                            <input type="text" class="form-control" placeholder="Last name">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text">@</span>
                            </div>
                            <input type="text" class="form-control" placeholder="Username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email (Optional)</label>
                        <input type="email" class="form-control" placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <input type="text" class="form-control" placeholder="1234 Main St">
                    </div>

                    <div class="form-group">
                        <label>Address 2 (Optional)</label>
                        <input type="text" class="form-control" placeholder="Apartment or suite">
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label>Country</label>
                            <select class="form-control">
                                <option>Choose..</option>
                                <option>US</option>
                                <option>India</option>
                            </select>
                        </div>

                        <div class="form-group col-md-4">
                            <label>State</label>
                            <select class="form-control">
                                <option>Choose..</option>
                                <option>Gujarat</option>
                                <option>Maharastra</option>
                            </select>
                        </div>

                        <div class="form-group col-md-4">
                            <label>Zip</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                    <hr>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Shipping address is the same as my billing address</label>
                    </div>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input">
                        <label class="form-check-label">Save this information for next times</label>
                    </div>
                    <hr>

                    <h4>Payment</h4>
                    <div class="form-check">
                        <input type="radio" name="paymentMethod" class="form-check-input" checked>
                        <label class="form-check-label">Credit card</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" name="paymentMethod" class="form-check-input">
                        <label class="form-check-label">Debit card</label>
                    </div>

                    <div class="form-check">
                        <input type="radio" name="paymentMethod" class="form-check-input">
                        <label class="form-check-label">PayPal</label>
                    </div>

                <div class="form-row mt-3">
                    <div class="form-group col-md-6 card1">
                        <label>Name on card</label>
                        <input type="text" class="form-control">
                        <p>Full name as displayed on card</p>
                    </div>
                    <div class="form-group col-md-6">
                        <label>Credit card number</label>
                        <input type="text" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group col-md-3">
                        <label>Expiration</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="form-group col-md-3">
                        <label>CVV</label>
                        <input type="password" class="form-control">
                    </div>
                </div>
                <hr>

                <button class="btn btn-primary btn-block mb-5">Continue to checkout</button>
                </form>     
            </div>
            <div class="col-md-4">
                <h4 style ="color: #007bff;">Your Cart <span class="float-right badge badge-pill badge-primary">3</span></h4>
                
                <ul class="list-group mb-3">
                    <li class="list-group-item d-flex justify-content-between">
                        <span><b>Product name</b><span class="d-block" style="color: #575757;">Brief description</span></span>
                        <span style="color: #575757;">$12</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span><b>Second product</b><span class="d-block" style="color: #575757;">Brief description</span></span>
                        <span style="color: #575757;">$8</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <span><b>Third item</b><span class="d-block" style="color: #575757;">Brief description</span></span>
                        <span style="color: #575757;">$5</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between text-success">
                        <span><b>Promo code</b><span class="d-block">EXAMPLECODE</span></span>
                        <span>-$5</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between">
                        <strong>Total (USD)</strong>
                        <strong>$20</strong>
                    </li>
                </ul>

                <form class="card p-2">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Promo code">
                        <div class="input-group-append">
                            <button type="submit" class="btn btn-secondary">Redeem</button>
                        </div>
                    </div>
                </form>
            </div>
          </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>
