<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="static/src/css/style.css">
    <title>Barcode Design</title>
</head>
<body>
    <div class="container mt-5">
        <div class="ticket shadow">
            <h2>Welcome</h2>
            <h5>YourCompany</h5>
            <h5>Parkingg Ticket</h5>
            <hr>
            <p><strong>Check-In Time:</strong> 06/03/2022 13:07:38</p>
            <p><strong>Expected Check-out Time:</strong> 06/03/2022 13:17:38</p>
            <p><strong>Placed:</strong> Gujarat / Gandhinagar / ST00002 / SS00014</p>
            <p><strong>Payment:</strong> $11.67</p>
            <hr>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=http://www.example.com" alt="QR Code">
            <p><a href="" style="text-decoration: none; color: #000;">http://www.example.com</a></p>
        </div>
    </div>

    <div class="container mt-5 mb-5">
        <div class="business-card row shadow">
            <div class="col-md-4 col-12 d-flex justify-content-center align-item-center mb-3 mb-md-0">
                <img src="static/src/image/img.png" class="img-fluid" alt="logo">
            </div>
            <div class="col-md-8 text-md-end text-center">
                <h5>Deco Addict</h5>
                <h5>(603)-996-3829</h5>
                <h5 style="overflow: hidden;">deco.addict82@example.com</h5>
                <img src="static/src/image/img2.png" class="img-fluid" alt="barcode">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>
